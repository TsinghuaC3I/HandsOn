env_name: t14_move_and_click_mouse
camera_mapping:
  base: ego_right
  wrist_left: wrist
  wrist_right: wrist
prompt: "Move the mouse onto the mouse pad and click the left mouse button."
robot_type: single_arm
time_limit_seconds: 80
skills:
  - contact_control
  - fine_motor
objects:
  - mouse
  - mousepad

