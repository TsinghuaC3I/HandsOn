env_name: t40_slide_knife_blade
camera_mapping:
  base: ego
  wrist_left: wrist_left
  wrist_right: wrist_right
prompt: "Pick up the utility knife with the right hand. After pickup, touch the slider with the left fingertips and move it to the episode target: bottom to retract the blade or top to extend it."
robot_type: dual_arm
time_limit_seconds: 90
skills:
  - right_hand_power_grasp
  - lifted_tool_control
  - left_hand_fingertip_slide
  - prismatic_slide
  - bimanual_handheld_coordination
objects:
  - utility_knife_body
  - blade_slider
