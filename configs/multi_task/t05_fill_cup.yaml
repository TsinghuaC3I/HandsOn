env_name: t05_fill_cup
camera_mapping: {base: front, wrist_left: wrist_left, wrist_right: wrist_right}
prompt: "Hold the white ceramic mug under the outlet with its local +Z axis within 15 degrees, inclusive, of world +Z. Pull the right lever outward toward the robots along its source-aligned hinge (with a world -X component) beyond 70 percent of its 45-degree opening travel; left-right temperature motion does not count. Keep the faucet open while the visible stream enters the mug for 15 consecutive control frames (0.5 seconds), then place the upright mug on the marked counter pad outside the sink and close the faucet."
robot_type: dual_arm
time_limit_seconds: 22
skills: [bimanual_stabilization, articulated_fixture, simultaneous_control]
objects: [ceramic_mug, faucet_fixture, faucet_handle]
