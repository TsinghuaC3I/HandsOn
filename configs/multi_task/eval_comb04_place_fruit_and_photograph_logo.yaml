env_name: eval_comb04_place_fruit_and_photograph_logo
camera_mapping:
  base: ego
  wrist_left: wrist_left
  wrist_right: wrist_right
prompt: "Pick the specified fruit, place it in the bucket and release it. Then pick up the camera, aim at the logo on the bucket and press the shutter."
robot_type: dual_arm
runtime_family: isaac_sim_5_1
physics_engine: PhysX
runtime:
  simulator: isaacsim-5.1
  isaaclab_version: 2.3.2
  physics_backend: physx
time_limit_seconds: 240
skills:
  - instructed_object_selection
  - pick_and_place
  - bimanual_coordination
  - aiming
  - fine_motor
objects:
  - apple
  - banana
  - orange
  - pear
  - bucket
  - camera
  - logo
