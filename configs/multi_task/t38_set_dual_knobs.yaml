env_name: t38_set_dual_knobs
camera_mapping: {base: front, wrist_left: wrist_left, wrist_right: wrist_right}
prompt: "Use the left hand on the left knob and the right hand on the right knob, start both rotations together, set both displayed targets, release both knobs, and keep the settings stable."
robot_type: dual_arm
time_limit_seconds: 40
skills: [bimanual_articulation, synchronized_rotation, assigned_hand_roles, release_and_stabilize]
objects: [knob_left, knob_right]
