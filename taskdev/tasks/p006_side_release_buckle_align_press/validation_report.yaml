  static_registration:
    status: passed
    result: "Task mapping imports as P0-06; UI order/label/steps, Isaac capability, preview, base spec, PhysX-only runtime, config, and asset bindings are present."
    evidence: evidence/platform_static_acceptance_hp14.json
  usd_live_parse:
    status: passed
    result: "Full Isaac 5.1 scene composed one female and one male rigid body; both exact USD hashes were enforced at load."
    evidence: evidence/runtime_reset_smoke_hp10_v1.json
  multipose_geometry:
    status: passed
    result: "7/7 separated/contact/18 mm/22.6 mm/low-contact/+8 deg/-8 deg poses stayed finite; worst buckle penetration 0.003196721 m <= 0.005 m."
    evidence: evidence/live_physics_acceptance_hp10_v3.json
  reset:
    status: passed
    result: "20/20 seeded resets were finite, non-successful, non-failed, and measured zero penetration; maximum XY writeback error was 2.14e-8 m and maximum relative axis error 6.95 deg."
    evidence: evidence/live_physics_acceptance_hp10_v3.json
  reachability:
    status: passed
    result: "40/40 corrected finger-workspace grasp targets solved; minimum joint-limit margin 0.3474 rad, maximum position error 0.000138 m, maximum orientation error 0.000116 rad."
    evidence: evidence/live_physics_acceptance_hp10_v3.json
  contact_instrumentation:
    status: passed
    result: "Four exact PhysX views initialized: right-female 1x21, left-male 1x21, buckle-body 1x1, robot-table 1x66."
    evidence: evidence/runtime_reset_smoke_hp10_v1.json
  ten_second_stability:
    status: passed
    result: "1,200 physics steps: zero NaNs, zero explosive samples, zero measured penetration, zero forbidden force; peak object speeds 0.1635 m/s and 0.00352 rad/s."
    evidence: evidence/live_physics_acceptance_hp10_v3.json
  pre_human_action_diagnostic:
    status: requires_human_teleoperation
    result: "A 480-step action-only diagnostic produced correct right-female and left-male physical contacts with 1.85 N peak robot-table force and no failure, but its simple open-loop grasp did not retain both low-profile parts through lift. It is diagnostic only and is not a generated dataset or successful episode."
