  cameras:
    status: requires_collection_workstation
    result: "Thirty valid frames from head and both wrist cameras require an RTX/Vulkan-enabled collection workstation."
  successful_episodes:
    status: requires_human_teleoperation
    result: "Three accepted __physx_v3 episodes remain required; the first must explicitly verify independent lift/retention of both 16 mm-tall parts before press."
