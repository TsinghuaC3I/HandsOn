notes:
  - "The 2026-08-29 15:54 collection exposed severe right-hand/lid visual penetration. Its Kit log identified seven GPU-incompatible authored convexes; four belonged to the lid, including its broad top panel and two long rims."
  - "The composed stage now gives those seven source meshes tight boundingCube collision approximations without changing the visible asset or articulation topology. A fresh Isaac Sim 5.1 log contained zero convex GPU-fallback messages."
  - "A 1200-frame zero-action run passed three randomized seeds and same-seed repetition with zero root drift. A scripted physical right-hand/lid probe then held contact for 1.0 second without reset or task failure; maximum penetration was 0.0533 mm against the 5 mm contract limit. This collision regression does not replace the pending full operator success/record/replay trial."
  - "On 2026-08-29 the operator requested FU015-style behavior because the floating box was too light to stabilize. G08 now reset-positions a native fixed-base articulation with conservative seeded XY/yaw randomization; table-contact force remains recorded only as diagnostics."
  - "All live evidence below predates the fixed-base semantic change and is retained as historical evidence only. It does not validate the current reset, reach, camera, success, recording, or replay contract."
  - "The 2026-08-29 fixed-base smoke validated the new task topology, deterministic same-seed reset, changed different-seed pose, and 240 zero-action physics frames. During process teardown the host repeated its order-7 allocation failure and Xid 31 pattern; no further Isaac runs were attempted in this change."
  - "The first live failure remains immutable evidence: gravity closed the -2 degree lid reset and the original base collision did not support the intended bottom envelope."
  - "The corrected rerun passed exact 2/25/1 topology and all 240 consecutive post-accept 120 Hz frames with zero unreadable samples."
  - "Minimum table support was 9.802622795 N with 12 contact points; clearance and separation were about 1.4-1.6 micrometres of signed contact compression, within [-0.25, +0.50] mm. This is a bounded-contact claim, not literal zero penetration."
  - "Stable origin passed for same-seed repetition, a different seed, and a rebuilt same-process hard reset."
  - "The user then reproduced automatic resets on ordinary contact. Two retained pre-fix trajectories first failed at 30.8439 mm and 30.4021 mm root translation, just above the old immediate 30 mm terminal threshold."
  - "The 30 mm / 8 degree envelope is now a recoverable progress/success guard: leaving it clears the current attempt without terminating. Only translation above 0.2 m or rotation above 60 degrees continuously for 0.5 seconds is a root-escape terminal."
  - "The task contract arms only after recording-origin acceptance. WAIT_RELEASE/STABILIZE stabilizer-contact loss, target loss (including a one-frame target-speed spike), and a tested 4 degree wrong-direction excursion clear the attempt and allow retry instead of causing an automatic-reset terminal."
  - "Live base-to-table support truth now gates progress and success on every physics substep, and a structured first-terminal reason is emitted before any true terminal reset. The final four-file focused suite passed 126 tests; persistent live static evidence passed 2/25/1 topology, all 240 frames, at least 9.8026 N/12-point support, and zero renderable collision-only paths."
  - "The post-fix live evidence did not include a real touch. A formal UI operator must still sustain intended contact for at least one second without automatic reset; this gate remains pending and is not claimed as passed."
  - "Operator workflow, live assigned-hand reach/contact, physical positive and negative success trials, canonical cameras, Zarr recording, and fresh-process replay remain unverified."
  - "Operator test collection is enabled, but collection validation and formal certification remain pending. Asset author, upstream source, license, and redistribution permission remain unresolved, so redistribution stays blocked."
