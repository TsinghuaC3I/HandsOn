schema_version: 1
task:
  id: t13_load_cans
  title: "B320-BC012 DualCanSynchronizedBinLoad"
  description: "Two ROKAE arms with Wuji generation-1 hands simultaneously pick the left and right tomato-soup cans with fixed hand roles, cross-load them into opposite-side open-bin partitions, release within 0.8 seconds, and leave both physically stable for 15 control frames."
  taxonomy:
    family: pick_place
    interactions: [bimanual_synchronized_pick, crossed_transport, synchronized_release]
    horizon: short
    handedness: bimanual
source:
  origin: adapted
  attribution: "Authoritative 32-task scene wave entry B320-BC012 (workbook row 173); exact YCB tomato-soup-can and SceneSmith authored open-bin sources."
  reference: "/mnt/pfs/luotianwei/handson-taskdev-orchestration/b320_32_scene_wave_20260817/source_rows.json#tasks[task_id=B320-BC012]; sha256=c1bf0990e8ec0ae651ae6d904c6b61e45796c8e11a670f6da782f4b23052e987"
  license: project
robot:
  arms:
    model: rokae
    count: 2
    asset: handson/handson/sim/envs/xmls/rokae_wuji1_bimanual.xml
    base_poses:
      - {position_m: [-0.75, 0.065, 1.34], orientation_xyzw: [0.7071067812, 0.0, 0.0, -0.7071067812]}
      - {position_m: [-0.75, -0.065, 1.34], orientation_xyzw: [0.7071067812, 0.0, 0.0, 0.7071067812]}
  hands:
    model: wuji_gen1
    generation: 1
    count: 2
    asset: handson/handson/sim/envs/xmls/rokae_wuji1_bimanual.xml
workspace:
  frame: world
  bounds_m:
    min: [-0.68, -0.44, 0.88]
    max: [0.16, 0.44, 1.25]
  targets:
    - id: left_can_pregrasp
      arm: left
      frame: world
      position_m: [-0.43, 0.28, 1.02]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
      clearance_m: 0.03
    - id: right_can_pregrasp
      arm: right
      frame: world
      position_m: [-0.43, -0.28, 1.02]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
      clearance_m: 0.03
    - id: left_bin_partition
      arm: right
      frame: world
      position_m: [-0.40, 0.065, 1.04]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
      clearance_m: 0.02
    - id: right_bin_partition
      arm: left
      frame: world
      position_m: [-0.40, -0.065, 1.04]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
      clearance_m: 0.02
assets:
  - id: left_tomato_soup_can
    path: taskdev/tasks/t13_load_cans/assets/tomato_soup_can/textured.usd
    kind: usd
    required: true
    scale_m: [1.0, 1.0, 1.0]
    collision: {enabled: true, approximation: cylinder_proxy}
  - id: right_tomato_soup_can
    path: taskdev/tasks/t13_load_cans/assets/tomato_soup_can/textured.usd
    kind: usd
    required: true
    scale_m: [1.0, 1.0, 1.0]
    collision: {enabled: true, approximation: cylinder_proxy}
  - id: open_sorting_bin
    path: taskdev/tasks/t13_load_cans/assets/open_bin/dexverse_authored_open_bin.glb
    kind: mesh
    required: true
    scale_m: [1.0, 1.0, 1.0]
    collision: {enabled: true, approximation: five_panel_box_proxy_plus_center_divider}
reset:
  seedable: true
  max_settle_steps: 128
  layout:
    table_top_z_m: 0.89
    left_can_xy_m: [-0.43, 0.28]
    right_can_xy_m: [-0.43, -0.28]
    open_bin_xyz_m: [-0.40, 0.0, 0.892]
    open_bin_source_orientation_xyzw: [0.7071067812, 0.0, 0.0, 0.7071067812]
    can_xy_jitter_m: 0.035
    bin_xy_jitter_m: 0.025
    can_yaw_jitter_degrees: 12.0
  invariants:
    - all_required_assets_present
    - finite_actor_state
    - no_initial_interpenetration_above_threshold
    - targets_inside_workspace
    - two_distinct_cans
    - initial_success_false
contact:
  monitored_pairs:
    - id: left_hand_left_can
      bodies: ["robot/left_hand/*", "assets/left_tomato_soup_can"]
      max_penetration_m: 0.005
    - id: right_hand_right_can
      bodies: ["robot/right_hand/*", "assets/right_tomato_soup_can"]
      max_penetration_m: 0.005
    - id: cans_open_bin
      bodies: ["assets/*_tomato_soup_can", "assets/open_sorting_bin/*"]
      max_penetration_m: 0.005
  forbidden_pairs:
    - id: cross_hand_substitution
      bodies: ["robot/left_hand/right_can_or_robot/right_hand/left_can", "assets/*"]
    - id: robot_table
      bodies: ["robot/*", "environment/table"]
success:
  logic: all
  predicates:
    - id: left_can_in_right_partition
      type: object_inside_aabb
      parameters: {object: assets/left_tomato_soup_can, target: goal/right_bin_partition, required: true}
    - id: right_can_in_left_partition
      type: object_inside_aabb
      parameters: {object: assets/right_tomato_soup_can, target: goal/left_bin_partition, required: true}
    - id: distinct_hand_roles
      type: simultaneous_role_contacts
      parameters: {left: left_can, right: right_can, same_hand_substitution_allowed: false}
    - id: synchronized_release
      type: release_time_delta
      parameters: {strict_max_seconds: 0.8}
    - id: settled_cans
      type: linear_speed
      parameters: {strict_max_mps: 0.04}
    - id: physical_release_and_support
      type: contact_release_velocity_upright
      parameters: {support_force_min_n: 0.0001, hand_contact_force_max_n: 0.05, hand_clearance_min_m: 0.075, upright_max_degrees: 20, angular_speed_max_radps: 0.5}
  hold_steps: 15
  timeout_steps: 900
camera:
  primary: head
  prim_path: /World/RecordCameras/head_camera
  pose_source: robot_head
  resolution: [640, 480]
  require_rgb: true
  streams:
    ego: {resolution_hwc: [480, 640, 3]}
    wrist_left: {resolution_hwc: [480, 640, 3]}
    wrist_right: {resolution_hwc: [480, 640, 3]}
stability:
  physics_hz: 120
  control_hz: 30
  settle_steps: 15
  max_linear_velocity_mps: 0.04
  max_angular_velocity_radps: 0.5
collection:
  format: zarr_v1
  output_env_var: HANDSON_OUTPUT_DIR
  required_streams: [action, proprioception, current_truth, next_truth, bc012_task_state, rgb_head, rgb_wrist_left, rgb_wrist_right, contacts, success, reset_seed, reset_options]
  min_successful_episodes: 1
validation:
  report: taskdev/tasks/t13_load_cans/validation_report.yaml
  required_checks: [schema, assets, reachability, contact, reset, success, camera, stability, collection]
  thresholds:
    schema: {max_errors: 0}
    assets: {max_missing: 0}
    reachability: {min_target_fraction: 1.0, min_joint_limit_margin_rad: 0.05, max_position_error_m: 0.01, max_orientation_error_rad: 0.15}
    contact: {max_penetration_m: 0.005, max_forbidden_events: 0}
    reset: {min_trials: 2, max_failure_fraction: 0.0}
    success: {min_positive_trials: 1, min_negative_trials: 10, max_false_positive_fraction: 0.0, max_false_negative_fraction: 0.0}
    camera: {min_frames: 1, max_black_fraction: 0.0, min_mean_rgb: 2.0, min_width: 640, min_height: 480}
    stability: {min_sim_seconds: 0.5, max_nan_count: 0, max_exploding_body_count: 0}
    collection: {min_episodes: 1, max_schema_errors: 0}
